name: CUE4Parse browser probe

on:
  push:
    branches: [main]
    paths:
      - "tools/CUE4Parse.BrowserProbe/**"
      - ".github/workflows/cue4parse-browser-probe.yml"
  pull_request:
    paths:
      - "tools/CUE4Parse.BrowserProbe/**"
      - ".github/workflows/cue4parse-browser-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore browser probe
        run: dotnet restore tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj

      - name: Publish CUE4Parse browser probe
        run: dotnet publish tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj --configuration Release --no-restore

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install actual browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify and execute browser bundle
        shell: bash
        run: |
          set -euo pipefail

          output_root="tools/CUE4Parse.BrowserProbe/bin/Release/net10.0"
          test -d "$output_root"

          dotnet_js="$(find "$output_root" -type f -path '*/_framework/dotnet.js' -print -quit)"
          test -n "$dotnet_js"

          framework_dir="$(dirname "$dotnet_js")"
          bundle="$(dirname "$framework_dir")"
          echo "Browser probe bundle: $bundle"

          wasm_file="$(find "$framework_dir" -type f -name '*.wasm' -print -quit)"
          test -n "$wasm_file"
          echo "Browser probe WASM: $wasm_file"

          cp tools/CUE4Parse.BrowserProbe/main.js "$bundle/main.js"


          node tools/CUE4Parse.BrowserProbe/runtime.test.mjs "$bundle"

      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cue4parse-browser-runtime
          path: browser-runtime-proof.json

name: CUE4Parse browser probe

on:
  push:
    branches: [main]
    paths:
      - "tools/CUE4Parse.BrowserProbe/**"
      - ".github/workflows/cue4parse-browser-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools

      - name: Restore browser probe
        run: dotnet restore tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj

      - name: Publish CUE4Parse browser probe
        run: dotnet publish tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj --configuration Release --no-restore

      - name: Verify and execute browser bundle
        shell: bash
        run: |
          set -euo pipefail

          publish_root="tools/CUE4Parse.BrowserProbe/bin/Release/net10.0/publish"
          test -d "$publish_root"

          main_js="$(find "$publish_root" -type f -name main.js -print -quit)"
          test -n "$main_js"

          bundle="$(dirname "$main_js")"
          echo "Browser probe bundle: $bundle"

          test -f "$bundle/_framework/dotnet.js"

          wasm_file="$(find "$bundle" -type f -name '*.wasm' -print -quit)"
          test -n "$wasm_file"
          echo "Browser probe WASM: $wasm_file"

          printf '{"type":"module"}\n' > "$bundle/package.json"

          probe_log="$RUNNER_TEMP/cue4parse-browser-wasm.log"
          node "$main_js" 2>&1 | tee "$probe_log"
          grep -Fq "CUE4PARSE_BROWSER_WASM_OK" "$probe_log"

          echo "CUE4Parse browser-WASM runtime probe succeeded: $bundle"

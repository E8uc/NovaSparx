name: NovaSparx checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NovaSparx.Backend.csproj

      - name: Build
        run: dotnet build NovaSparx.Backend.csproj --configuration Release --no-restore

      - name: Build reference-index tool
        run: dotnet build tools/NovaSparx.ReferenceIndex/NovaSparx.ReferenceIndex.csproj --configuration Release

      - name: Probe CUE4Parse browser-WASM compatibility
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install wasm-tools

          probe_out="$RUNNER_TEMP/cue4parse-browser-probe"
          probe_log="$RUNNER_TEMP/cue4parse-browser-probe.log"
          rm -rf "$probe_out"

          dotnet publish tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj             --configuration Release             --output "$probe_out"

          main_js="$(find "$probe_out" -type f -name main.js -print -quit)"
          test -n "$main_js"

          framework_dir="$(dirname "$main_js")/_framework"
          test -f "$framework_dir/dotnet.js"
          test -n "$(find "$framework_dir" -maxdepth 1 -type f -name '*.wasm' -print -quit)"

          node "$main_js" | tee "$probe_log"
          grep -Fq "CUE4PARSE_BROWSER_WASM_OK" "$probe_log"

      - name: Check shell startup script
        run: bash -n start.sh

      - name: Validate web package metadata
        run: node -e "JSON.parse(require('fs').readFileSync('web/package.json','utf8'))"

      - name: Check browser modules
        run: |
          node --check web/novasparx-format.js
          node --check web/novasparx-viewer.js
          node --check web/novasparx-browser-transport.js
          node --check web/novasparx-random-access.js
          node --check web/novasparx-local-parser.js
          node --check web/novasparx-layers.js
          node --check web/novasparx-browser-guard.js

      - name: Run browser format self-test
        run: node web/novasparx-viewer.selftest.mjs

      - name: Run browser memory guard self-test
        run: node web/novasparx-browser-guard.selftest.mjs

      - name: Run browser transport security self-test
        run: node web/novasparx-browser-transport.selftest.mjs

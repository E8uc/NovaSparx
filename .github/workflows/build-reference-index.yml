name: Build NovaSparx reference index

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "tools/NovaSparx.ReferenceIndex/**"
      - "PublicFortniteSources.cs"
      - "NovaSparx.Backend.csproj"
      - ".github/workflows/build-reference-index.yml"

permissions:
  contents: write

concurrency:
  group: novasparx-reference-index
  cancel-in-progress: false

jobs:
  build-reference-index:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build Blueprint referencer index
        env:
          NOVASPARX_CACHE_DIR: /tmp/novasparx-reference-index
        run: |
          dotnet run             --project tools/NovaSparx.ReferenceIndex/NovaSparx.ReferenceIndex.csproj             --configuration Release             -- web/reference-index

      - name: Commit reference index
        shell: bash
        run: |
          set -euo pipefail

          generated="$(mktemp -d)"
          cp -a web/reference-index/. "$generated/"

          git fetch origin main
          git reset --hard origin/main

          rm -rf web/reference-index
          mkdir -p web/reference-index
          cp -a "$generated"/. web/reference-index/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add web/reference-index

          if git diff --cached --quiet; then
            echo "Reference index is already current."
            exit 0
          fi

          git commit -m "Build NovaSparx AssetRegistry reference index"
          git push origin HEAD:main
